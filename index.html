<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovative To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>To-Do</h1>
        </header>

        <div class="input-section">
            <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
            <input type="datetime-local" id="task-deadline" class="date-input" title="Set Deadline">
            <button id="add-btn" class="primary-btn">Add</button>
        </div>

        <ul id="task-list" class="task-list">
            <!-- Tasks will be injected here -->
        </ul>

        <div id="empty-state" class="empty-state hidden">
            <p>No tasks yet.</p>
        </div>

        <!-- Subtle Footer Controls -->
        <div class="footer-controls">
            <button id="calendar-btn" class="icon-btn" title="Calendar">
                <span class="material-icons-round">calendar_today</span>
            </button>
            <button id="voice-btn" class="icon-btn" title="Voice Input">
                <span class="material-icons-round">mic</span>
            </button>
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>
    </div>

    <!-- Calendar Modal -->
    <div id="calendar-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="calendar-month-year">Month Year</h2>
                <div class="calendar-nav">
                    <button id="prev-month" class="icon-btn"><span
                            class="material-icons-round">chevron_left</span></button>
                    <button id="next-month" class="icon-btn"><span
                            class="material-icons-round">chevron_right</span></button>
                    <button id="close-calendar" class="icon-btn"><span
                            class="material-icons-round">close</span></button>
                </div>
            </div>
            <div class="calendar-grid-header">
                <div>Su</div>
                <div>Mo</div>
                <div>Tu</div>
                <div>We</div>
                <div>Th</div>
                <div>Fr</div>
                <div>Sa</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- Days injected here -->
            </div>
        </div>
    </div>

    <!-- Focus Mode Overlay -->
    <div id="focus-overlay" class="focus-overlay hidden">
        <div class="focus-content">
            <div class="focus-header">
                <h2>Focus Mode</h2>
                <button id="close-focus-btn" class="icon-btn close-btn">
                    <span class="material-icons-round">close</span>
                </button>
            </div>
            <div class="focus-task-display">
                <h3 id="focus-task-text">Complete the design mockups</h3>
            </div>
            <div class="timer-display">
                <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
            </div>
            <div class="focus-controls">
                <button id="start-timer-btn" class="focus-btn">Start Focus</button>
                <button id="pause-timer-btn" class="focus-btn hidden">Pause</button>
                <button id="reset-timer-btn" class="focus-btn secondary">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
